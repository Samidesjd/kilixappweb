name: Deploy Kilix Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Expo Web
        run: npx expo export --platform web

      - name: Add GitHub Pages deep-link fallback
        shell: bash
        run: |
          cat > dist/404.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Kilix</title>
          </head>
          <body>
            <p>Loading Kilix...</p>
            <script>
              (function () {
                var base = '/kilixappweb/';
                var path = window.location.pathname;
                var productMarker = '/product/';
                var productIndex = path.indexOf(productMarker);
                var target = base;

                if (productIndex !== -1) {
                  var id = path.slice(productIndex + productMarker.length).split('/')[0];
                  if (id) {
                    target += '?product=' + encodeURIComponent(id);
                  }
                }

                window.location.replace(target);
              })();
            </script>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
