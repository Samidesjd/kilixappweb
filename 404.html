<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Kilix</title>
</head>
<body>
  <p>Loading Kilix...</p>
  <script>
    (function () {
      var base = '/kilixappweb/';
      var path = window.location.pathname;
      var target = new URL(base, window.location.origin);
      var marker = base + 'product/';
      if (path.indexOf(marker) === 0) {
        var productId = path.slice(marker.length).split('/')[0];
        if (productId) target.searchParams.set('product', productId);
      }
      window.location.replace(target.toString());
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=/kilixappweb/" /></noscript>
</body>
</html>
